<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StormCloud</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/ca898dc459.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Top Fixed Header -->
  <header class="header-container">
    <div class="header-left">
      <img id="logo" src="images/logo2.png" alt="StormCloud logo">
    </div>
    
    <div id="search-wrapper">
        <i id="search-glass" class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search" placeholder="Search for a song, artist, album...">
    </div>
    
    <!-- Empty spacer to balance header flexbox and keep search bar centered -->
    <div class="header-right"></div>
  </header>

  <!-- Left Fixed Sidebar Navigation -->
  <nav>
    <ul>
      <li><a href="#Home"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="#Explore"><i class="fa-solid fa-magnifying-glass"></i> Explore</a></li>
      <li><a href="#Library"><i class="fa-solid fa-headphones"></i> Library</a></li>
      <li><a href="#Playlists"><i class="fa-solid fa-list"></i> Playlists</a></li>
      <li><a href="#Favorites"><i class="fa-regular fa-heart"></i> Favorites</a></li>
      <li><a href="#Latest releases"><i class="fa-solid fa-fire"></i> Latest releases</a></li>
      <li><a href="#Artists"><i class="fa-solid fa-user"></i> Artists</a></li>
      <li><a href="#Albums"><i class="fa-solid fa-compact-disc"></i> Albums</a></li>
      <li><a href="#Genres"><i class="fa-solid fa-table-cells-large"></i> Genres</a></li>
    </ul>
  </nav>  
  

  <!-- Main Content Area -->
  <main>
    
  
  </main>

</body>
</html>
